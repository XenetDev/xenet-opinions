app = "xenet-opinions-proxy"
primary_region = "lhr"

[env]
  MIROFISH_UPSTREAM = "xenet-opinions-mirofish.internal:5001"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
