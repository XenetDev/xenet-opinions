app = "xenet-opinions-mirofish"
primary_region = "lhr"

[env]
  PORT = "5001"
  FLASK_HOST = "::"
  OASIS_DB_PATH = "/app/backend/uploads/oasis-default.db"

[[mounts]]
  source = "mirofish_uploads"
  destination = "/app/backend/uploads"

[checks]
  [checks.health]
    type = "http"
    port = 5001
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
