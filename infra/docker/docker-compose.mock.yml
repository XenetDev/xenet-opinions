services:
  mirofish-mock:
    # Built by `worker`; a second `build:` for the same tag races it and fails.
    image: ghcr.io/xenetdev/xenet-opinions-worker:${XO_IMAGE_TAG:-edge}
    pull_policy: missing
    restart: unless-stopped
    command: ["pnpm", "--filter", "@xo/mirofish", "mock"]
    environment:
      HOST: 0.0.0.0
      PORT: "5001"
      MOCK_TOKEN: ${MIROFISH_TOKEN:?set MIROFISH_TOKEN in .env.selfhost}
      MOCK_SPEED: ${MOCK_SPEED:-5}
      MOCK_INTERVIEW_DELAY_MS: ${MOCK_INTERVIEW_DELAY_MS:-1500}
    networks: [backend]

  mirofish-proxy:
    environment:
      MIROFISH_UPSTREAM: mirofish-mock:5001
