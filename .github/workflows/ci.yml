name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://xo:xo@localhost:5432/xo
      TEST_DATABASE_URL: postgresql://xo:xo@localhost:5432/xo_test
      BETTER_AUTH_SECRET: Y2ktZHVtbXktc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGk=
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MIROFISH_URL: http://localhost:5001
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .data/uploads
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xo
          POSTGRES_PASSWORD: xo
          POSTGRES_DB: xo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xo -d xo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:licenses
      - run: pnpm test:scripts
      - run: pnpm --filter @xo/db db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash infra/docker/compose.test.sh
      - run: bash infra/mirofish/caddyfile.test.sh
      - uses: docker/setup-buildx-action@v4
      # ci-* scopes keep amd64-only CI exports from evicting release.yml's multi-arch cache
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: false
          load: false
          build-args: NEXT_PUBLIC_APP_URL=http://localhost:3000
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=ci-worker
          cache-to: type=gha,mode=max,scope=ci-worker
      - uses: docker/build-push-action@v7
        with:
          context: infra/mirofish
          file: infra/mirofish/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=ci-mirofish
          cache-to: type=gha,mode=max,scope=ci-mirofish
